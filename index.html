<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Baralho da Decisão</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a url('plano-fundo-baralho.png') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        header { text-align: center; margin-top: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; padding: 20px; }
        .slot { display: flex; flex-direction: column; align-items: center; }
        .label { font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .card {
            width: 140px; height: 210px; cursor: pointer;
            border-radius: 10px; box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            background: #fff; position: relative; overflow: hidden;
            transition: transform 0.3s ease;
        }
        .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; }
        .card.highlighted { transform: scale(1.4); z-index: 1000; box-shadow: 0 15px 30px rgba(0,0,0,0.8); }
        .controls { margin-bottom: 30px; }
        button {
            background-color: #4CAF50; color: white; border: none;
            padding: 14px 28px; font-size: 1.1rem; font-weight: bold;
            border-radius: 8px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        button:hover { background-color: #45a049; }
        @media (max-width: 650px) { .card { width: 100px; height: 150px; } }
    </style>
</head>
<body>
    <header>
        <h1>O Baralho da Decisão</h1>
        <p>Clique para destacar e clique novamente para ver o verso</p>
    </header>

    <div class="container" id="grid"></div>

    <div class="controls">
        <button onclick="iniciarJogo()">Embaralhar Novamente</button>
    </div>

    <script>
        const grupos = [
            { nome: "Grupo 1 (01-08)", min: 1, max: 8 },
            { nome: "Grupo 2 (09-16)", min: 9, max: 16 },
            { nome: "Grupo 3 (17-24)", min: 17, max: 24 },
            { nome: "Grupo 4 (25-32)", min: 25, max: 32 }
        ];

        let ativa = null;

        function sortear(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function iniciarJogo() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            ativa = null;

            grupos.forEach(g => {
                const id = sortear(g.min, g.max);
                const num = String(id).padStart(2, '0');

                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.innerHTML = `<div class="label">${g.nome}</div>`;

                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.estado = 'frente';
                card.dataset.num = num;

                const img = document.createElement('img');
                img.src = `frente-${num}.png`;
                img.onerror = () => { card.innerHTML = `<div style="padding:10px;color:#333;text-align:center;font-size:12px;">frente-${num}.png</div>`; };
                card.appendChild(img);

                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (ativa && ativa !== card) resetar(ativa);

                    if (!card.classList.contains('highlighted')) {
                        card.classList.add('highlighted');
                        ativa = card;
                    } else {
                        const n = card.dataset.num;
                        if (card.dataset.estado === 'frente') {
                            card.dataset.estado = 'verso';
                            card.innerHTML = `<img src="verso-${n}.png" onerror="this.parentElement.innerHTML='<div style=\\'padding:10px;color:#333;text-align:center;font-size:12px;\\'>verso-${n}.png</div>';">`;
                        } else {
                            card.dataset.estado = 'frente';
                            card.innerHTML = `<img src="frente-${n}.png" onerror="this.parentElement.innerHTML='<div style=\\'padding:10px;color:#333;text-align:center;font-size:12px;\\'>frente-${n}.png</div>';">`;
                        }
                    }
                });

                slot.appendChild(card);
                grid.appendChild(slot);
            });
        }

        function resetar(c) {
            c.classList.remove('highlighted');
            c.dataset.estado = 'frente';
            const n = c.dataset.num;
            c.innerHTML = `<img src="frente-${n}.png" onerror="this.parentElement.innerHTML='<div style=\\'padding:10px;color:#333;text-align:center;font-size:12px;\\'>frente-${n}.png</div>';">`;
        }

        document.addEventListener('click', () => { if (ativa) { resetar(ativa); ativa = null; } });

        window.onload = iniciarJogo;
    </script>
</body>
</html>
