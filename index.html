<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Baralho da Decisão</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #2b2b2b;
            background-image: url('plano-fundo-baralho.PNG');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        header {
            margin-top: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        header p {
            margin: 8px 0 0;
            font-size: 1.1rem;
        }

        /* Área onde as 4 cartas são exibidas */
        .cards-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            padding: 20px;
            margin: auto;
        }

        /* Cada slot de grupo */
        .card-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .group-label {
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .card {
            width: 140px;
            height: 210px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            background-color: white;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
            display: block;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Carta em Destaque (Zoom) */
        .card.highlighted {
            transform: scale(1.4) !important;
            z-index: 1000 !important;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
        }

        /* Painel de Controles */
        .controls {
            margin-bottom: 30px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #45a049;
            transform: scale(1.03);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Responsividade para telas menores */
        @media (max-width: 650px) {
            .card {
                width: 100px;
                height: 150px;
            }
            .cards-container {
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>O Baralho da Decisão</h1>
        <p>Clique em uma carta para destacar e clique novamente para revelar o verso</p>
    </header>

    <div class="cards-container" id="cardsContainer">
        <!-- As 4 cartas aleatórias serão geradas aqui -->
    </div>

    <div class="controls">
        <button onclick="embaralharCartas()">Embaralhar Novamente</button>
    </div>

    <script>
        const grupos = [
            { id: 1, inicio: 1, fim: 8, nome: "Grupo 1 (01 - 08)" },
            { id: 2, inicio: 9, fim: 16, nome: "Grupo 2 (09 - 16)" },
            { id: 3, inicio: 17, fim: 24, nome: "Grupo 3 (17 - 24)" },
            { id: 4, inicio: 25, fim: 32, nome: "Grupo 4 (25 - 32)" }
        ];

        let cartaSelecionada = null;

        function sortearNumero(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function criarBaralho() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            cartaSelecionada = null;

            grupos.forEach(grupo => {
                const idSorteado = sortearNumero(grupo.inicio, grupo.fim);

                const slot = document.createElement('div');
                slot.classList.add('card-slot');

                const label = document.createElement('div');
                label.classList.add('group-label');
                label.innerText = grupo.nome;

                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.estado = 'frente';
                card.dataset.id = idSorteado;

                const img = document.createElement('img');
                const numeroFormatado = String(idSorteado).padStart(2, '0');
                img.src = `frente-${numeroFormatado}.PNG`;
                img.alt = `Carta ${idSorteado}`;

                img.onerror = function() {
                    card.innerHTML = `<span style="padding: 10px; text-align: center; font-size: 11px; color: #333;">Falta:<br>frente-${numeroFormatado}.PNG</span>`;
                };

                card.appendChild(img);

                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    lidarComCliqueCarta(card, idSorteado);
                });

                slot.appendChild(label);
                slot.appendChild(card);
                container.appendChild(slot);
            });
        }

        function lidarComCliqueCarta(card, id) {
            const numeroFormatado = String(id).padStart(2, '0');

            if (cartaSelecionada && cartaSelecionada !== card) {
                resetarCarta(cartaSelecionada);
            }

            if (!card.classList.contains('highlighted')) {
                card.classList.add('highlighted');
                cartaSelecionada = card;
            } else {
                if (card.dataset.estado === 'frente') {
                    card.dataset.estado = 'verso';
                    card.innerHTML = `<img src="verso-${numeroFormatado}.PNG" alt="Verso ${numeroFormatado}" onerror="this.parentElement.innerHTML='<span style=\\'padding: 10px; text-align: center; font-size: 11px; color: #333;\\'>Falta:<br>verso-${numeroFormatado}.PNG</span>';">`;
                } else {
                    card.dataset.estado = 'frente';
                    card.innerHTML = `<img src="frente-${numeroFormatado}.PNG" alt="Carta ${numeroFormatado}" onerror="this.parentElement.innerHTML='<span style=\\'padding: 10px; text-align: center; font-size: 11px; color: #333;\\'>Falta:<br>frente-${numeroFormatado}.PNG</span>';">`;
                }
            }
        }

        function resetarCarta(card) {
            card.classList.remove('highlighted');
            card.dataset.estado = 'frente';
            const id = card.dataset.id;
            const numeroFormatado = String(id).padStart(2, '0');
            card.innerHTML = `<img src="frente-${numeroFormatado}.PNG" alt="Carta ${numeroFormatado}" onerror="this.parentElement.innerHTML='<span style=\\'padding: 10px; text-align: center; font-size: 11px; color: #333;\\'>Falta:<br>frente-${numeroFormatado}.PNG</span>';">`;
        }

        document.addEventListener('click', () => {
            if (cartaSelecionada) {
                resetarCarta(cartaSelecionada);
                cartaSelecionada = null;
            }
        });

        function embaralharCartas() {
            criarBaralho();
        }

        window.onload = criarBaralho;
    </script>
</body>
</html>
